# Development tooling only. At runtime the skills call scripts/adt.py through
# `uv run --script`, which reads the inline PEP 723 metadata in that file.
[project]
name = "android-tester"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pillow>=11"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
