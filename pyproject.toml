# Two ways to run adt: the Claude Code plugin calls scripts/adt.py through `uv run --script` (inline
# PEP 723 metadata there), and other agents use the `adt` command from `uv tool install`, built from here.
# Keep the dependencies in both places in sync.
[project]
name = "android-tester"
version = "0.2.0"
description = "adt: the Android device tool behind the android-tester agent skills"
requires-python = ">=3.11"
dependencies = ["pillow>=11", "pyyaml>=6"]

[project.scripts]
adt = "adtlib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/adtlib"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
